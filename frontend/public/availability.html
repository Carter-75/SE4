<!doctype html>
<html lang="en">
<head>
<!-- Page metadata and the shared responsive stylesheet. -->

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set availability</title>
<link rel="stylesheet" href="styles.css">
<!-- Add your JavaScript files here or before the closing body tag. Refresh-to-login behavior must also be implemented there. -->
</head>
<body>
<!-- HTML/CSS handoff: add JavaScript for authentication, data loading, validation, and saving. -->

<!-- Main page layout; styles.css adapts it to the browser width. -->
<main class="schedule-page">
  <h1>Make your Schedule!</h1>
  <section class="slot-creation">
    <h2>Create an appointment slot</h2>
    <p>Choose a specific date and service for customers to book.</p>
    <form method="post" class="requirements-form" id="slot-form">
      <label>Service type<!-- Dropdown: read the selected value when handling this form. -->
<select name="serviceType" required><option>Beauty</option><option>Medical</option><option>Fitness</option></select></label>
      <label>Appointment title<!-- Input: name identifies the value to send; type sets text, password, date, time, or selection behavior. -->
<input name="appointmentTitle" required placeholder="e.g. Hair Highlight"></label>
      <label>Date<!-- Input: name identifies the value to send; type sets text, password, date, time, or selection behavior. -->
<input type="date" name="date" required value="2026-10-20"></label>
      <label>Start time<!-- Input: name identifies the value to send; type sets text, password, date, time, or selection behavior. -->
<input type="time" name="startTime" required value="15:00"></label>
      <label>End time<!-- Input: name identifies the value to send; type sets text, password, date, time, or selection behavior. -->
<input type="time" name="endTime" required></label>
      <!-- CLICK: Save title, service, date, and times for the signed-in provider; show success here. -->
<button type="submit">Create slot</button><!-- Display success or error messages here; remove hidden when a message is available. -->
<p id="slot-status" role="status"></p>
    </form>
    <p>The provider name comes from the signed-in account.</p>

  </section>
</main>

<script>
  const slotForm = document.getElementById('slot-form');
  const slotStatus = document.getElementById('slot-status');

  slotForm.addEventListener('submit', async function (event) {
    event.preventDefault();

    slotStatus.textContent = 'Creating appointment slot...';

    const formData = new FormData(slotForm);

    const slotData = {
      serviceType: formData.get('serviceType'),
      appointmentTitle: formData.get('appointmentTitle'),
      date: formData.get('date'),
      startTime: formData.get('startTime'),
      endTime: formData.get('endTime')
    };

    try {
      const response = await fetch('/api/appointments/slots', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        credentials: 'include',
        body: JSON.stringify(slotData)
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.message || 'Could not create appointment slot.');
      }

      slotStatus.textContent = 'Appointment slot created successfully!';
      slotForm.reset();
    } catch (error) {
      slotStatus.textContent = error.message;
    }
  });
</script>

</body>
</html>
