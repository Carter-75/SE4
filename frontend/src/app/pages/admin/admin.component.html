<!-- Admin Dashboard Header -->
<div class="dashboard-header-wrapper">
    <header class="dashboard-header">

        <h1>Admin Dashboard</h1>

        <div class="header-right">

            <button type="button" class="logout-button" (click)="logout()">
                Logout
            </button>

            <div *ngIf="adminName" class="dashboard-user-name">
                {{ adminName }}
            </div>

        </div>

    </header>
</div>

<main class="dashboard">

    <!-- User Control -->
    <button class="dashboard-button user-control" type="button">
        <div class="icon-circle">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 21v-2a8 8 0 0 1 16 0v2" />
            </svg>
        </div>
        <span>User control!</span>
    </button>

    <!-- Account Settings -->
    <button class="dashboard-button account-settings" type="button">
        <div class="icon-circle">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3" />
                <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
                <path d="M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" />
            </svg>
        </div>
        <span>Account settings!</span>
    </button>

    <!-- Appointment Hub -->
    <button class="dashboard-button appointment-hub" type="button" routerLink="/admin/appointments">
        <div class="icon-circle">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="16" rx="2" />
                <path d="M7 2v6M17 2v6M3 10h18" />
                <path d="m9 16 2 2 4-4" />
            </svg>
        </div>
        <span>Appointment Hub</span>
    </button>

    <!-- Appointment Statistics -->
    <button class="dashboard-button appointment-statistics" type="button">
        <div class="icon-circle">
            <svg viewBox="0 0 24 24">
                <path d="M3 21h18" />
                <rect x="5" y="12" width="3" height="9" />
                <rect x="11" y="7" width="3" height="14" />
                <rect x="17" y="3" width="3" height="18" />
            </svg>
        </div>
        <span>Appointment Statistics!</span>
    </button>

</main>
