<!-- HTML/CSS handoff: add JavaScript for authentication, data loading, validation, and saving. -->

<!-- Main page layout; styles.css adapts it to the browser width. -->
<main class="schedule-page">
  
  <h1>Make your Schedule!</h1>
  <section class="slot-creation">
    <h2>Create an appointment slot</h2>
    <p>Choose a specific date and service for customers to book.</p>
    <form method="post" class="requirements-form" id="slot-form" (submit)="createSlot($event)">
      <label>Service type<!-- Dropdown: read the selected value when handling this form. -->
<select name="serviceType" required><option value="beauty">Beauty</option><option value="medical">Medical</option><option value="fitness">Fitness</option></select></label>
      <label>Appointment title<!-- Input: name identifies the value to send; type sets text, password, date, time, or selection behavior. -->
<input name="appointmentTitle" required placeholder="e.g. Hair Highlight"></label>
      <label>Date<!-- Input: name identifies the value to send; type sets text, password, date, time, or selection behavior. -->
<input type="date" name="date" required [min]="today"></label>
      <label>Start time<!-- Input: name identifies the value to send; type sets text, password, date, time, or selection behavior. -->
<input type="time" name="startTime" required value="15:00"></label>
      <label>End time<!-- Input: name identifies the value to send; type sets text, password, date, time, or selection behavior. -->
<input type="time" name="endTime" required></label>
      <!-- CLICK: Save title, service, date, and times for the signed-in provider; show success here. -->
<button type="submit">Create slot</button><!-- Display success or error messages here; remove hidden when a message is available. -->
<p id="slot-status" role="status">{{ slotStatus }}</p>
    </form>
    <p>The provider name comes from the signed-in account.</p>

  </section>
</main>
