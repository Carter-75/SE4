
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Your Appointments</title>
  <link rel="stylesheet" href="providerAppView.css">
</head>

<body>
  <main class="page">

    <h1>View Your Appointments</h1>

    <div class="layout">

      <!-- Calendar -->
      <section class="calendar-section">

        <div class="calendar-header">
          <button id="prevMonth" class="nav-button"
                  aria-label="Previous month">‹</button>

          <div class="month-year">
            <select id="monthSelect" aria-label="Select month"></select>
            <select id="yearSelect" aria-label="Select year"></select>
          </div>

          <button id="nextMonth" class="nav-button"
                  aria-label="Next month">›</button>
        </div>

        <div class="weekdays">
          <span>Sun</span>
          <span>Mon</span>
          <span>Tue</span>
          <span>Wed</span>
          <span>Thu</span>
          <span>Fri</span>
          <span>Sat</span>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>

      </section>

      <!-- Appointments for selected day -->
      <aside class="appointments-panel">

        <h2>Current Appointments</h2>

        <p id="selectedDate" class="selected-date"></p>

        <p id="appointmentCount" class="appointment-count"></p>

        <div id="appointmentList" class="appointment-list"
             aria-live="polite"></div>

      </aside>

    </div>
  </main>

  <script>
    // The backend will provide the provider's appointments.
    const API_URL = "/api/provider/appointments";

    let appointments = [];
    let loading = true;
    let loadError = "";

    const today = new Date();

    let displayedYear = today.getFullYear();
    let displayedMonth = today.getMonth();

    let selectedDate = formatDateKey(today);

    const calendarGrid = document.getElementById("calendarGrid");
    const appointmentList = document.getElementById("appointmentList");
    const selectedDateText = document.getElementById("selectedDate");
    const appointmentCount = document.getElementById("appointmentCount");

    const monthSelect = document.getElementById("monthSelect");
    const yearSelect = document.getElementById("yearSelect");

    const monthNames = [
      "January", "February", "March", "April",
      "May", "June", "July", "August",
      "September", "October", "November", "December"
    ];

    // Use local dates to avoid timezone-related day changes.
    function formatDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function formatReadableDate(dateKey) {
      const [year, month, day] = dateKey.split("-").map(Number);
      const date = new Date(year, month - 1, day);

      return date.toLocaleDateString("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      });
    }

    function formatTime(time) {
      if (!time) return "Time unavailable";

      const [hours, minutes] = time.split(":").map(Number);

      if (!Number.isFinite(hours) || !Number.isFinite(minutes)) {
        return time;
      }

      const date = new Date(2000, 0, 1, hours, minutes);

      return date.toLocaleTimeString("en-US", {
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function isCancelled(appointment) {
      return ["cancelled", "canceled"].includes(
        (appointment.status || "").toLowerCase()
      );
    }

    // Fill the month and year dropdowns.
    function setupSelectors() {
      monthNames.forEach((month, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = month;
        monthSelect.appendChild(option);
      });

      // Allow a wide range of years.
      for (let year = 2000; year <= 2100; year++) {
        const option = document.createElement("option");
        option.value = year;
        option.textContent = year;
        yearSelect.appendChild(option);
      }
    }

    // Draw the calendar for the selected month.
    function renderCalendar() {
      calendarGrid.replaceChildren();

      monthSelect.value = displayedMonth;
      yearSelect.value = displayedYear;

      const firstDay = new Date(
        displayedYear, displayedMonth, 1
      ).getDay();

      const daysInMonth = new Date(
        displayedYear, displayedMonth + 1, 0
      ).getDate();

      // Blank cells align the first day with the correct weekday.
      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "calendar-empty";
        calendarGrid.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(displayedYear, displayedMonth, day);
        const dateKey = formatDateKey(date);

        const button = document.createElement("button");
        button.type = "button";
        button.className = "calendar-day";
        button.textContent = day;
        button.setAttribute(
          "aria-label",
          formatReadableDate(dateKey)
        );

        if (dateKey === formatDateKey(today)) {
          button.classList.add("today");
        }

        if (dateKey === selectedDate) {
          button.classList.add("selected");
          button.setAttribute("aria-pressed", "true");
        } else {
          button.setAttribute("aria-pressed", "false");
        }

        // Mark days that have customer bookings.
        const hasAppointments = appointments.some(appointment =>
          appointment.date === dateKey && !isCancelled(appointment)
        );

        if (hasAppointments) {
          const dot = document.createElement("span");
          dot.className = "appointment-dot";
          dot.setAttribute("aria-hidden", "true");
          button.appendChild(dot);
        }

        button.addEventListener("click", () => {
          selectedDate = dateKey;
          renderCalendar();
          renderAppointments();
        });

        calendarGrid.appendChild(button);
      }
    }

    // Create a card for a customer's booking.
    function createAppointmentCard(appointment) {
      const card = document.createElement("article");
      card.className = "appointment-card";

      const time = document.createElement("p");
      time.className = "appointment-time";
      time.textContent = formatTime(appointment.time);

      const customer = document.createElement("h3");
      customer.textContent = appointment.customerName || "Customer";

      const service = document.createElement("p");
      service.className = "service-name";
      service.textContent = appointment.serviceName || "Service";

      const status = document.createElement("p");
      status.className = "appointment-status";
      status.textContent = "Scheduled";

      const cancelButton = document.createElement("button");
      cancelButton.type = "button";
      cancelButton.className = "cancel-button";
      cancelButton.textContent = "Cancel Appointment";

      cancelButton.addEventListener("click", () => {
        cancelAppointment(appointment.id, cancelButton);
      });

      card.append(time, customer, service, status, cancelButton);

      return card;
    }

    // Display appointments for the selected calendar date.
    function renderAppointments() {
      appointmentList.replaceChildren();

      selectedDateText.textContent = formatReadableDate(selectedDate);

      if (loading) {
        appointmentCount.textContent = "";
        showMessage("Loading appointments...");
        return;
      }

      if (loadError) {
        appointmentCount.textContent = "";
        showMessage(loadError, true);
        return;
      }

      const dailyAppointments = appointments
        .filter(appointment =>
          appointment.date === selectedDate &&
          !isCancelled(appointment)
        )
        .sort((a, b) =>
          (a.time || "").localeCompare(b.time || "")
        );

      const count = dailyAppointments.length;

      appointmentCount.textContent =
        `${count} ${count === 1 ? "appointment" : "appointments"}`;

      if (count === 0) {
        showMessage("No appointments scheduled for this day.");
        return;
      }

      dailyAppointments.forEach(appointment => {
        appointmentList.appendChild(
          createAppointmentCard(appointment)
        );
      });
    }

    function showMessage(message, isError = false) {
      const paragraph = document.createElement("p");
      paragraph.className = isError
        ? "message error-message"
        : "message";

      paragraph.textContent = message;
      appointmentList.appendChild(paragraph);
    }

    // Retrieve bookings for the signed-in service provider.
    async function loadAppointments() {
      loading = true;
      loadError = "";
      renderAppointments();

      try {
        const response = await fetch(API_URL, {
          credentials: "same-origin"
        });

        if (!response.ok) {
          throw new Error("Unable to load provider appointments");
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error("Invalid appointment data");
        }

        appointments = data;
      } catch (error) {
        console.error(error);
        appointments = [];
        loadError = "Could not load appointments.";
      } finally {
        loading = false;
        renderCalendar();
        renderAppointments();
      }
    }

    // Cancel the selected customer's appointment.
    async function cancelAppointment(id, button) {
      const confirmed = confirm(
        "Are you sure you want to cancel this customer's appointment?"
      );

      if (!confirmed) return;

      button.disabled = true;
      button.textContent = "Cancelling...";

      try {
        const response = await fetch(
          `${API_URL}/${encodeURIComponent(id)}/cancel`,
          {
            method: "PATCH",
            credentials: "same-origin"
          }
        );

        if (!response.ok) {
          throw new Error("Unable to cancel appointment");
        }

        // Refresh bookings after the backend confirms cancellation.
        await loadAppointments();

      } catch (error) {
        console.error(error);
        alert("Could not cancel the appointment. Please try again.");

        button.disabled = false;
        button.textContent = "Cancel Appointment";
      }
    }

    // Move to the previous or next month.
    function changeMonth(amount) {
      const date = new Date(
        displayedYear,
        displayedMonth + amount,
        1
      );

      displayedYear = date.getFullYear();
      displayedMonth = date.getMonth();

      // Select the first day when changing months.
      selectedDate = formatDateKey(date);

      renderCalendar();
      renderAppointments();
    }

    document.getElementById("prevMonth").addEventListener(
      "click", () => changeMonth(-1)
    );

    document.getElementById("nextMonth").addEventListener(
      "click", () => changeMonth(1)
    );

    monthSelect.addEventListener("change", () => {
      displayedMonth = Number(monthSelect.value);

      selectedDate = formatDateKey(
        new Date(displayedYear, displayedMonth, 1)
      );

      renderCalendar();
      renderAppointments();
    });

    yearSelect.addEventListener("change", () => {
      displayedYear = Number(yearSelect.value);

      selectedDate = formatDateKey(
        new Date(displayedYear, displayedMonth, 1)
      );

      renderCalendar();
      renderAppointments();
    });

    // Initialize the page.
    setupSelectors();
    renderCalendar();
    loadAppointments();
  </script>
</body>
</html>
